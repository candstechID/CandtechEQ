name: Build Candstech EQ APK - Auto Extract + Auto Hapus Cache

# - Extract ZIP di server (bukan di repo, bukan di cache)
# - Cache dihapus OTOMATIS tiap build: di awal + di akhir
# - Jadi tiap build selalu bersih, tidak pakai cache lama

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Izin buat hapus cache GitHub via gh CLI
permissions:
  contents: read
  actions: write

jobs:
  build-from-zip:
    name: Extract ZIP + Build APK (Cache Auto Hapus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Hapus Cache Otomatis - AWAL (biar build bersih)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. Hapus cache lokal di Runner ==="
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/daemon
          rm -rf ~/.m2/repository
          rm -rf ~/.android/build-cache
          rm -rf extracted out
          rm -rf app/build app/.cxx build
          echo "Cache lokal dihapus."
          echo ""
          echo "=== 2. Hapus cache GitHub Actions (server) ==="
          echo "Cek daftar cache..."
          gh cache list || echo "Tidak ada cache / gh belum siap"
          echo "Hapus semua cache..."
          gh cache delete --all --confirm || echo "Tidak ada cache yang perlu dihapus / sudah bersih"
          echo ""
          echo "=== 3. Hapus sisa build lama ==="
          find . -name "*.apk" -delete || true
          find . -name "*.aab" -delete || true
          echo "Bersih! Siap extract ZIP baru."

      - name: Cari & Extract ZIP di server (PALING DULU!)
        id: extract
        run: |
          echo "=== Isi repo ==="
          ls -lh
          echo ""
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Ketemu ZIP: $ZIP_FILE"
            echo "Extract di server..."
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
            echo "Hasil extract:"
            ls -lh extracted/
            echo "zip_found=true" >> $GITHUB_OUTPUT
          else
            echo "Tidak ada ZIP, pakai project yang sudah ter-extract"
            echo "zip_found=false" >> $GITHUB_OUTPUT
          fi
          if [ "${{ steps.extract.outputs.zip_found }}" = "true" ]; then
            PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="extracted"
            fi
          else
            PROJECT_DIR="."
            if [ -f "CandstechEQ/settings.gradle.kts" ]; then
              PROJECT_DIR="CandstechEQ"
            fi
          fi
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          ls -lh "$PROJECT_DIR"

      - name: Set up JDK 17 (TANPA cache)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # cache sengaja TIDAK dipakai, biar tidak bikin error + tidak nyimpen cache

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7 (cache dimatikan)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build APK (tanpa cache)
        run: |
          echo "Build dari: $PROJECT_DIR (tanpa cache)"
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-build-cache --rerun-tasks

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          find "$PROJECT_DIR" -name "app-debug.apk" | head -n 5
          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK tidak ketemu!"
            exit 1
          fi
          cp "$APK" out/CandstechEQ-debug.apk
          ls -lh out/

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CandstechEQ-debug-APK
          path: out/CandstechEQ-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Hapus Cache Otomatis - AKHIR (biar tidak numpuk)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Bersih-bersih akhir build ==="
          rm -rf ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/daemon
          rm -rf ~/.m2/repository
          rm -rf extracted
          rm -rf "$PROJECT_DIR/app/build" "$PROJECT_DIR/build"
          echo "Coba hapus cache GitHub lagi..."
          gh cache delete --all --confirm || echo "Cache GitHub sudah bersih"
          echo "Selesai, cache sudah dihapus otomatis."
