name: Extract + Auto Patch Compose + Build APK (CLEAN v6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean + Extract SATU ZIP saja
        run: |
          rm -rf extracted
          mkdir -p extracted
          # Ambil HANYA 1 ZIP (yang pertama). Kalau ada >1 ZIP, yang lain diabaikan biar tidak dobel file _1
          ZIP=$(ls -t *.zip | head -n 1)
          echo "ZIP dipakai: $ZIP"
          echo "Semua ZIP di repo:"
          ls -l *.zip
          unzip -q "$ZIP" -d extracted
          echo "--- Cek file dobel _1 / _2 (penyebab Redeclaration) ---"
          find extracted -name "*_1.kt" -o -name "*_2.kt" | tee /tmp/dup.txt || true
          if [ -s /tmp/dup.txt ]; then
            echo "HAPUS file dobel _1/_2 yang kebawa di ZIP:"
            cat /tmp/dup.txt
            rm -f $(cat /tmp/dup.txt)
          fi
          echo "--- Struktur ---"
          find extracted -maxdepth 3 -type d | head -n 20
          # Cari PROJECT_DIR (folder yang ada settings.gradle.kts)
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Auto Patch Compose 2.0.21 + hapus composeOptions
        run: |
          echo "Patch di $PROJECT_DIR"
          # Root build.gradle.kts -> paksa 2.0.21
          sed -i 's/version "2\.0\.0"/version "2.0.21"/g; s/version "2\.0\.20"/version "2.0.21"/g' "$PROJECT_DIR/build.gradle.kts" || true
          # App build.gradle.kts -> hapus composeOptions lama (penyebab error composeOptions)
          python3 - << 'PY'
          import pathlib, re, os
          p = pathlib.Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          t = p.read_text()
          t = re.sub(r'\s*composeOptions\s*\{[^}]*\}', '', t)
          p.write_text(t)
          print("composeOptions dihapus, sisa composeOptions?", "composeOptions" in t)
          PY
          cat "$PROJECT_DIR/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK - Android Gradle
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew || true
          if [ -f gradlew ]; then ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandstechEQ-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
